---
- name: "software | Include repository tasks"
  args:
    apply:
      become: true
  ansible.builtin.include_tasks:
    file: repo.yml

- name: "software | Include package tasks"
  args:
    apply:
      become: true
  ansible.builtin.include_tasks:
    file: pkg.yml

- name: "software | Enable and start Vicinae"
  ansible.builtin.systemd_service:
    name: vicinae
    scope: user
    state: started
    enabled: true
