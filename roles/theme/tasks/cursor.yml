---
- name: "cursor | Ensure icons directory exists"
  ansible.builtin.file:
    path: ~/.icons
    state: directory
    mode: '0755'

- name: "cursor | Copy BreezeX library"
  ansible.builtin.unarchive:
    src: files/BreezeX.tar.xz
    dest: ~/.icons/

- name: "cursor | Set cursor"
  community.general.dconf:
    key: "/org/gnome/desktop/interface/cursor-theme"
    value: "'{{ theme.cursor }}'"
    state: present
